<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font: 12px/1.5 -apple-system, "PingFang SC", sans-serif;
    background: #1e1e1e; color: #d4d4d4;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .hdr {
    padding: 10px 12px 8px; border-bottom: 1px solid #333;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #6b7280; flex: none; }
  .dot.ok { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
  .dot.warn { background: #f59e0b; }
  .dot.err { background: #ef4444; }
  #status-text { font-weight: 600; color: #e5e7eb; }
  .fields { display: flex; gap: 6px; margin-left: auto; }
  .fields label { display: flex; align-items: center; gap: 4px; color: #9ca3af; }
  .fields input {
    width: 52px; background: #2d2d2d; color: #e0e0e0; border: 1px solid #444;
    border-radius: 4px; padding: 2px 6px; font: 11px ui-monospace, monospace;
  }
  .fields input#channel { width: 68px; }
  .stats {
    padding: 5px 12px; border-bottom: 1px solid #333; color: #9ca3af;
    display: flex; gap: 14px; font-size: 11px;
  }
  .stats b { color: #d1d5db; font-weight: 600; }
  .sel-box { border-bottom: 1px solid #333; padding: 6px 12px 8px; }
  .sel-head {
    display: flex; align-items: center; gap: 8px; color: #9ca3af; font-size: 11px; margin-bottom: 4px;
  }
  .sel-head .n { color: #d1d5db; font-weight: 600; }
  .sel-head button { margin-left: auto; padding: 2px 8px; font-size: 11px; }
  #sel-list { display: flex; flex-direction: column; gap: 3px; }
  .sel-node {
    display: flex; align-items: center; gap: 6px; padding: 3px 6px;
    background: #232323; border: 1px solid #333; border-radius: 6px; cursor: pointer;
  }
  .sel-node:hover { border-color: #2563eb; }
  .sel-node .nm { color: #e5e7eb; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46%; }
  .sel-node .ty { color: #6b7280; font-size: 10px; flex: none; }
  .sel-node .id { color: #60a5fa; font: 10px ui-monospace, monospace; margin-left: auto; flex: none; }
  .sel-node .sz { color: #6b7280; font-size: 10px; flex: none; }
  .sel-empty { color: #6b7280; font-size: 11px; padding: 2px 0; }
  #log {
    flex: 1; overflow-y: auto; padding: 8px 10px;
    font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #171717;
  }
  .ln { white-space: pre-wrap; word-break: break-all; }
  .ln .t { color: #525252; margin-right: 6px; }
  .ln.info .m { color: #9ca3af; }
  .ln.ok .m { color: #4ade80; }
  .ln.cmd .m { color: #60a5fa; }
  .ln.res .m { color: #a78bfa; }
  .ln.err .m { color: #f87171; }
  .ln.prog .m { color: #d97706; }
  .foot {
    padding: 8px 12px; border-top: 1px solid #333;
    display: flex; gap: 8px;
  }
  button {
    background: #2d2d2d; color: #d4d4d4; border: 1px solid #444; border-radius: 6px;
    padding: 5px 12px; font: 12px -apple-system, "PingFang SC", sans-serif; cursor: pointer;
  }
  button:hover { background: #3a3a3a; }
  button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  button.primary:hover { background: #1d4ed8; }
</style>
</head>
<body>
  <div class="hdr">
    <span class="dot" id="dot"></span>
    <span id="status-text">初始化…</span>
    <div class="fields">
      <label>ch <input id="channel" value="dtc" title="channel，与 dtc extract --channel 一致，回车生效"></label>
      <label>port <input id="port" value="3055" title="relay 端口，回车生效"></label>
    </div>
  </div>
  <div class="stats">
    <span>收 <b id="cnt-in">0</b></span>
    <span>发 <b id="cnt-out">0</b></span>
    <span>最近 <b id="last-cmd">-</b></span>
  </div>
  <div class="sel-box">
    <div class="sel-head">
      <span>当前选中 <span class="n" id="sel-count">0</span> 个</span>
      <button id="btn-copy-cmd" title="复制 dtc extract --node <第一个选中节点>">复制提取命令</button>
    </div>
    <div id="sel-list"><div class="sel-empty">（未选中节点）在 Figma 里点选图层后此处实时更新</div></div>
  </div>
  <div id="log"></div>
  <div class="foot">
    <button id="btn-toggle" class="primary">重连</button>
    <button id="btn-copy">复制诊断</button>
    <button id="btn-clear">清空日志</button>
  </div>

<script>
(function () {
  // ---- 状态 ----
  var LS = {
    get: function (k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var channelInput = document.getElementById("channel");
  var portInput = document.getElementById("port");
  channelInput.value = LS.get("dtc:channel", "dtc");
  portInput.value = LS.get("dtc:uiPort", "3055");

  var state = {
    socket: null,
    connected: false,
    manualStop: false,
    retry: 0,
    retryTimer: null,
    inCount: 0,
    outCount: 0,
    pending: new Map(), // id -> {command}（仅用于日志展示）
    logs: []
  };

  // ---- 日志 ----
  var logEl = document.getElementById("log");
  var LOG_MAX = 200;
  function log(type, msg) {
    var time = new Date().toTimeString().slice(0, 8);
    var line = { t: time, type: type, m: String(msg) };
    state.logs.push(line);
    if (state.logs.length > LOG_MAX) state.logs.shift();
    var div = document.createElement("div");
    div.className = "ln " + type;
    div.innerHTML = '<span class="t"></span><span class="m"></span>';
    div.querySelector(".t").textContent = time;
    div.querySelector(".m").textContent = msg;
    logEl.appendChild(div);
    while (logEl.children.length > LOG_MAX) logEl.removeChild(logEl.firstChild);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function setStatus(cls, text) {
    document.getElementById("dot").className = "dot " + cls;
    document.getElementById("status-text").textContent = text;
  }
  function bump() {
    document.getElementById("cnt-in").textContent = state.inCount;
    document.getElementById("cnt-out").textContent = state.outCount;
  }

  // ---- relay 连接 ----
  function connect() {
    if (state.socket) return;
    var port = parseInt(portInput.value, 10) || 3055;
    var channel = (channelInput.value || "dtc").trim();
    LS.set("dtc:uiPort", String(port));
    LS.set("dtc:channel", channel);
    setStatus("warn", "连接 ws://localhost:" + port + " …");
    log("info", "连接 ws://localhost:" + port + "（channel " + channel + "）");
    var ws;
    try { ws = new WebSocket("ws://localhost:" + port); }
    catch (e) { log("err", "WebSocket 创建失败: " + e.message); return scheduleReconnect(); }
    state.socket = ws;

    ws.onopen = function () {
      ws.send(JSON.stringify({ type: "join", channel: channel }));
    };
    ws.onmessage = function (ev) {
      var data;
      try { data = JSON.parse(ev.data); } catch (e) { return; }
      var msg = data.message || {};
      // join 确认（system + result 对象）
      if (data.type === "system") {
        if (msg && typeof msg === "object" && msg.result) {
          state.connected = true; state.retry = 0;
          setStatus("ok", "已连接 · channel " + channel);
          log("ok", "已加入 channel " + channel + "（relay 就绪，等 dtc 命令）");
        } else if (typeof msg === "string") {
          log("info", "relay: " + msg);
        }
        return;
      }
      if (data.type === "error") { log("err", "relay 错误: " + (typeof msg === "string" ? msg : JSON.stringify(msg))); return; }
      if (data.type === "progress_update") return; // relay 侧进度转发，噪音
      // 命令（来自 dtc CLI / MCP）
      if (msg && msg.command) {
        state.inCount++; bump();
        state.pending.set(msg.id, msg.command);
        document.getElementById("last-cmd").textContent = msg.command;
        log("cmd", "→ " + msg.command + " " + JSON.stringify(msg.params || {}).slice(0, 120));
        parent.postMessage(
          { pluginMessage: { type: "execute-command", id: msg.id || data.id, command: msg.command, params: msg.params } },
          "*"
        );
      }
    };
    ws.onclose = function () {
      state.socket = null;
      if (state.connected) log("err", "连接断开");
      state.connected = false;
      if (!state.manualStop) scheduleReconnect(); else setStatus("err", "已断开（手动）");
    };
    ws.onerror = function () { /* onclose 会接手 */ };
  }

  function scheduleReconnect() {
    state.retry += 1;
    var delay = Math.min(30000, 1000 * Math.pow(1.6, state.retry - 1));
    setStatus("warn", "重连中 · 第 " + state.retry + " 次（" + Math.round(delay / 1000) + "s 后）");
    log("info", "重连中 · 第 " + state.retry + " 次（先确认 relay：bun socket）");
    clearTimeout(state.retryTimer);
    state.retryTimer = setTimeout(connect, delay);
  }

  function stop() {
    state.manualStop = true;
    clearTimeout(state.retryTimer);
    if (state.socket) state.socket.close();
    state.socket = null;
  }

  // ---- 选区显示 ----
  var selList = document.getElementById("sel-list");
  var selCount = document.getElementById("sel-count");
  var lastSelection = [];
  function idToCmd(id) { return "dtc extract --node " + id.replace(":", "-"); }
  function copyText(text, okMsg, errObj) {
    function done(ok) { log(ok ? "ok" : "err", ok ? okMsg : (errObj || "复制失败")); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { fallback(); });
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { done(document.execCommand("copy")); } catch (e) { done(false); }
      document.body.removeChild(ta);
    }
  }
  function renderSelection(nodes) {
    lastSelection = nodes || [];
    selCount.textContent = String(lastSelection.length);
    selList.innerHTML = "";
    if (!lastSelection.length) {
      var emp = document.createElement("div");
      emp.className = "sel-empty";
      emp.textContent = "（未选中节点）在 Figma 里点选图层后此处实时更新";
      selList.appendChild(emp);
      return;
    }
    lastSelection.forEach(function (n) {
      var row = document.createElement("div");
      row.className = "sel-node";
      row.title = "点击复制 nodeId：" + n.id;
      var nm = document.createElement("span"); nm.className = "nm"; nm.textContent = n.name || "(未命名)";
      var ty = document.createElement("span"); ty.className = "ty"; ty.textContent = n.type || "";
      var sz = document.createElement("span"); sz.className = "sz";
      sz.textContent = n.width ? Math.round(n.width) + "×" + Math.round(n.height) : "";
      var id = document.createElement("span"); id.className = "id"; id.textContent = n.id;
      row.appendChild(nm); row.appendChild(ty); row.appendChild(sz); row.appendChild(id);
      row.onclick = function () { copyText(n.id, "已复制 nodeId " + n.id); };
      selList.appendChild(row);
    });
  }
  document.getElementById("btn-copy-cmd").onclick = function () {
    if (!lastSelection.length) { log("err", "没有选中节点，先在 Figma 里选一个"); return; }
    copyText(idToCmd(lastSelection[0].id), "已复制: " + idToCmd(lastSelection[0].id));
  };

  // ---- sandbox（插件代码）↔ 面板 ----
  window.addEventListener("message", function (e) {
    var pm = e.data && e.data.pluginMessage;
    if (!pm) return;
    if (pm.type === "command-result") {
      state.outCount++; bump();
      var cmd = state.pending.get(pm.id) || "?";
      state.pending.delete(pm.id);
      var brief = JSON.stringify(pm.result ?? {}).slice(0, 100);
      log("res", "← " + cmd + " OK " + brief);
      if (state.socket && state.socket.readyState === 1) {
        state.socket.send(JSON.stringify({ id: pm.id, type: "message", channel: (channelInput.value || "dtc").trim(), message: { id: pm.id, result: pm.result || {} } }));
      }
    } else if (pm.type === "command-error") {
      state.outCount++; bump();
      var cmd2 = state.pending.get(pm.id) || "?";
      state.pending.delete(pm.id);
      log("err", "← " + cmd2 + " 失败: " + pm.error);
      if (state.socket && state.socket.readyState === 1) {
        state.socket.send(JSON.stringify({ id: pm.id, type: "message", channel: (channelInput.value || "dtc").trim(), message: { id: pm.id, result: {}, error: pm.error } }));
      }
    } else if (pm.type === "command_progress") {
      var st = pm.status || "";
      if (st === "started" || st === "completed" || st === "error") {
        log("prog", "⏳ " + (pm.commandType || "") + " " + st + (pm.message ? " — " + pm.message : ""));
      }
    } else if (pm.type === "selection") {
      renderSelection(pm.nodes || []);
      if ((pm.nodes || []).length) {
        log("info", "选中 " + pm.nodes.length + " 个: " + pm.nodes.slice(0, 3).map(function (n) { return n.name + "(" + n.id + ")"; }).join(", ") + (pm.nodes.length > 3 ? " …" : ""));
      }
    } else if (pm.type === "notify") {
      log("info", "插件: " + (pm.message || ""));
    } else if (pm.type === "resize") {
      /* 忽略 */
    } else {
      log("info", "sandbox: " + JSON.stringify(pm).slice(0, 100));
    }
  });

  // ---- 按钮 ----
  var btnToggle = document.getElementById("btn-toggle");
  function refreshToggle() {
    btnToggle.textContent = state.connected ? "断开" : "重连";
  }
  btnToggle.onclick = function () {
    if (state.connected) { stop(); refreshToggle(); }
    else { state.manualStop = false; state.retry = 0; clearTimeout(state.retryTimer); connect(); refreshToggle(); }
  };
  var t = setInterval(refreshToggle, 1000); void t;
  document.getElementById("btn-clear").onclick = function () {
    state.logs = [];
    logEl.innerHTML = "";
  };
  document.getElementById("btn-copy").onclick = function () {
    var text = [
      "# dtc-bridge 诊断",
      "# url: " + location.href,
      "# ua: " + navigator.userAgent,
      "# 状态: connected=" + state.connected + " retry=" + state.retry + " channel=" + channelInput.value + " port=" + portInput.value,
      "# 收=" + state.inCount + " 发=" + state.outCount,
      "--- 日志 ---"
    ].concat(state.logs.map(function (l) { return l.t + " [" + l.type + "] " + l.m; })).join("\n");
    function done(ok) { log(ok ? "ok" : "err", ok ? "诊断已复制到剪贴板" : "复制失败，请手动选择日志"); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { fallback(); });
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { done(document.execCommand("copy")); } catch (e) { done(false); }
      document.body.removeChild(ta);
    }
  };
  [channelInput, portInput].forEach(function (inp) {
    inp.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        log("info", "参数变更 → 重连（channel " + channelInput.value.trim() + ", port " + portInput.value + "）");
        stop(); state.manualStop = false; state.retry = 0; connect();
      }
    });
  });

  // ---- 启动：自动连接 ----
  log("info", "dtc-bridge 面板就绪（协议：ws relay + pluginMessage）");
  connect();
})();
</script>
</body>
</html>
